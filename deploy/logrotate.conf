# 服务日志轮转。日志不轮转会慢���把磁盘写满——这比服务崩溃更隐蔽，
# 因为发现时往往已经是磁盘 100% 导致的连锁故障。
#
# 安装：sudo cp deploy/logrotate.conf /etc/logrotate.d/remote-storage
#
# 说明：
#   - daily + rotate 14：保留两周
#   - compress：轮转后 gzip，节省空间
#   - copytruncate：服务持续写同一个文件时不发信号，直接复制后截断。
#     （journald 场景用 systemd 自带的 journal 限制，见 .service 里的 SystemMaxUse）
#   - maxsize：即使没到 daily，超过 100M 也强制轮转，防止被刷爆
/var/log/remote-storage/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 100M
    create 0640 remote-storage remote-storage
    su remote-storage remote-storage
}

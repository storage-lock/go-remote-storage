# 公网入口：nginx 终止 TLS，转发给本机 remote-storage-server。
#
# 注意：remote-storage-server 只监听 127.0.0.1:8443，不要直接暴露到公网——
# Bearer token 会以明文传输。

limit_req_zone $binary_remote_addr zone=remote_storage:10m rate=600r/m;

upstream remote_storage_backend {
    server 127.0.0.1:8443;
    keepalive 32;
}

server {
    listen 80;
    server_name storage.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name storage.example.com;

    ssl_certificate     /etc/letsencrypt/live/storage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;
    client_body_timeout 10s;

    location / {
        limit_req zone=remote_storage burst=120 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        # 覆写而不是追加：防止客户端伪造 XFF。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering off;

        proxy_pass http://remote_storage_backend;
    }

    location = /v1/health {
        access_log off;
        proxy_pass http://remote_storage_backend;
    }
}
